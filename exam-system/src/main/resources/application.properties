spring.application.name=exam-system

# ========== 服务器端口 ==========
server.port=8080

# ========== MySQL 数据库连接 ==========
spring.datasource.url=jdbc:mysql://localhost:3306/exam_system?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== MyBatis 配置 ==========
# 下划线字段自动映射为驼峰属性（如 create_time -> createTime）
mybatis.configuration.map-underscore-to-camel-case=true
# SQL 日志（开发阶段方便排查问题，上线前改成 NONE）
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# Mapper XML 文件位置（后面写复杂 SQL 时用）
mybatis.mapper-locations=classpath:mapper/*.xml
# 实体类别名包：Mapper XML 里 resultType="SysUser" 就不用写全限定名了
mybatis.type-aliases-package=com.exam.exam_system.entity

# ========== JWT 配置 ==========
# 签名密钥：HS256 要求至少 32 字节（这里正好 64 个字符，别改短！）
jwt.secret=ExamSystemJwtSecretKey_2026_ChangeMeInProduction_0123456789
# token 有效期（小时）：学生考试场景 24 小时合理，正式上线可改 2 小时
jwt.expire-hours=24

# ========== Redis 配置（本机未安装 Redis 时系统自动降级，功能不受影响） ==========
# 缓存总开关：false 时完全绕过 Redis
redis.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=3s

# ========== JSON 格式化输出（调试接口更直观） ==========
spring.jackson.serialization.indent-output=true

# ========== AI 错题讲解配置 ==========
# 支持任意 OpenAI 兼容的 Chat Completions 接口（DeepSeek / 通义千问 / 智谱 / Moonshot 等）
# 未配置 api-key 时自动降级为「本地规则解析引擎」，功能依然可用（source=local）
# 当前使用阿里云百炼（通义千问）OpenAI 兼容接口
ai.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ai.api-key=sk-ws-H.PDIXIPX.MfYJ.MEYCIQDJtr8x4LCdnDtthzXglne4OlGmj22Vrg9fdaJp8d5iVwIhAKjOa9TFZREPfqexE5werxQgfOos7He8wzBBHzVQ7PNv
ai.model=qwen-plus
ai.timeout-seconds=60

# ========== 学习资料文件上传 ==========
# 单文件与请求大小限制（支持 PDF/Word/PPT/Excel 等）。
# 注意：前端 StudyResourceList.vue 的提示文案与大小校验需与此值保持一致
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB
# Tomcat 单次连接允许吞掉的多余请求体（文件超限后 body 剩余部分）。
# 默认仅 2MB：上传超过 max-file-size 时连接会被直接重置，前端收不到响应而误报"网络异常"；
# 设为 -1（不限制）让 Tomcat 读完剩余 body，再由全局异常处理器返回明确的"文件过大"提示。
server.tomcat.max-swallow-size=-1
# 文件上传根目录（相对运行目录）。学习资料存在 uploads/study-resource/ 下；
# WebConfig 会把 /uploads/** 映射到该目录，PDF 等可浏览器直接预览。
upload.dir=./uploads/
